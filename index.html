<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EyeLink – head-controlled communication</title>
<meta name="description" content="EyeLink lets people with limited movement ask their caretaker for help by turning their head. Works in the browser with a webcam.">
<meta name="theme-color" content="#14808f">
<meta property="og:title" content="EyeLink – head-controlled communication">
<meta property="og:description" content="Turn your head to choose, hold still to select. A caretaker gets the request instantly.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eaf1f4; --surface: #ffffff; --ink: #12222d; --muted: #4d6270; --line: #b9cad3;
  --accent: #14808f; --accent-soft: #cfe7ea; --yes: #1f7a46; --yes-soft: #d3ecdc;
  --no: #a8402f; --no-soft: #f4d9d3; --warn: #8a5a00; --warn-soft: #fbe9c4; --ring-bg: #d5e0e6;
  --on-accent: #ffffff;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a22; --surface: #17262f; --ink: #eaf3f7; --muted: #9fb5c1; --line: #35505f;
    --accent: #4cc3d3; --accent-soft: #1b4650; --yes: #6fd39a; --yes-soft: #1b4430;
    --no: #f19a8a; --no-soft: #4a2620; --warn: #f2c668; --warn-soft: #4a3911; --ring-bg: #2b4350;
    --on-accent: #07202a;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a22; --surface: #17262f; --ink: #eaf3f7; --muted: #9fb5c1; --line: #35505f;
  --accent: #4cc3d3; --accent-soft: #1b4650; --yes: #6fd39a; --yes-soft: #1b4430;
  --no: #f19a8a; --no-soft: #4a2620; --warn: #f2c668; --warn-soft: #4a3911; --ring-bg: #2b4350;
  --on-accent: #07202a;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 18px; line-height: 1.4; min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 14px; }
header.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; padding-bottom: 10px; margin-bottom: 4px; border-bottom: 2px solid var(--line); }
.brand { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.brand .eye { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.brand .eye i { width: 14px; height: 14px; border-radius: 50%; background: var(--bg); display: block; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 8px 14px; cursor: pointer; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.plain { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 14px; cursor: pointer; font-weight: 700; }
h1.title { font-size: clamp(1.6rem, 4.5vw, 2.3rem); margin: 12px 0; line-height: 1.15; }
.sub { color: var(--muted); margin: 0 0 14px; }

.login { max-width: 460px; margin: 28px auto 0; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 24px; }
.login h1 { margin: 0 0 6px; font-size: 1.9rem; }
.field { margin: 14px 0; }
.field label { display: block; font-weight: 700; margin-bottom: 6px; }
.field input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); font-size: 1.05rem; }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.roles button { border: 3px solid var(--line); background: var(--bg); border-radius: 14px; padding: 14px 10px; cursor: pointer; font-weight: 700; display: grid; gap: 4px; justify-items: center; }
.roles button span.e { font-size: 1.8rem; }
.roles button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.go { width: 100%; margin-top: 8px; padding: 14px; border: 0; border-radius: 14px; cursor: pointer; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 1.15rem; }
.panel { max-width: 640px; margin: 18px auto 0; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 24px; }
.panel ol { padding-left: 1.2em; margin: 8px 0 16px; }
.panel li { margin: 6px 0; }
.status { padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); margin: 10px 0; }
.status.err { background: var(--no-soft); }

.settings { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; color: var(--muted); font-size: .92rem; }
.settings select { padding: 4px 8px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); }
.settings label.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.banner { background: var(--yes-soft); border: 3px solid var(--yes); border-radius: 16px; padding: 12px 16px; margin: 10px 0; font-size: 1.25rem; font-weight: 700; }
.banner[hidden] { display: none; }
.how { margin: 8px 0 0; color: var(--muted); font-size: 1rem; }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.grid.fill { grid-auto-rows: 1fr; min-height: calc(100vh - 250px); }
.grid.two { max-width: 900px; }
.grid.quad { grid-template-columns: repeat(2, 1fr); }
.grid.quad.fill { grid-template-rows: repeat(2, 1fr); grid-auto-rows: auto; }
.tile.wide { grid-column: 1 / -1; flex-direction: row; gap: 16px; padding: 10px; }
.tile.wide .ring { width: 64px; height: 64px; }
.tile.wide .disc { width: 50px; height: 50px; font-size: 1.6rem; }
@media (min-width: 720px) { .grid.three { grid-template-columns: repeat(3, 1fr); } }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px 10px; border-radius: 24px; background: var(--surface); border: 3px solid var(--line); opacity: .78; user-select: none; -webkit-user-select: none; }
.tile.focus { opacity: 1; border-color: var(--accent); border-width: 6px; transform: scale(1.03); box-shadow: 0 0 0 5px var(--accent-soft); }
.tile .ring { --p: 0; width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--p) * 1turn), var(--ring-bg) 0); }
.tile .disc { width: 90px; height: 90px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 2.8rem; }
.tile .label { font-size: 1.6rem; font-weight: 700; text-align: center; }
.tile .count { position: absolute; top: 10px; right: 14px; font-size: 1.1rem; font-weight: 700; color: var(--accent); min-width: 3ch; text-align: right; }
.tile.yes { background: var(--yes-soft); }
.tile.no { background: var(--no-soft); }
.tile.yes.focus { border-color: var(--yes); box-shadow: 0 0 0 5px var(--yes-soft); }
.tile.no.focus { border-color: var(--no); box-shadow: 0 0 0 5px var(--no-soft); }
.tile.yes .ring { background: conic-gradient(var(--yes) calc(var(--p) * 1turn), var(--ring-bg) 0); }
.tile.no .ring { background: conic-gradient(var(--no) calc(var(--p) * 1turn), var(--ring-bg) 0); }
.confirmTop { display: flex; align-items: center; gap: 16px; }
.confirmTop .big { font-size: 3.6rem; }
.sent { text-align: center; padding: 40px 10px; }
.sent .tick { width: 120px; height: 120px; border-radius: 50%; background: var(--yes); color: #fff; display: grid; place-items: center; font-size: 3.6rem; margin: 0 auto 18px; }

.topline { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.list { display: grid; gap: 12px; margin-top: 8px; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.card.open { border-color: var(--accent); border-width: 3px; }
.card .head { display: flex; gap: 14px; align-items: center; }
.card .ic { font-size: 2.2rem; }
.card .tx { font-size: 1.4rem; font-weight: 700; }
.card .tm { color: var(--muted); font-size: .95rem; }
.badge { margin-left: auto; padding: 4px 10px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 700; font-size: .9rem; white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions button { border: 2px solid var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; cursor: pointer; font-weight: 700; }
.replied { color: var(--yes); font-weight: 700; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 2px dashed var(--line); border-radius: 18px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#errBar { position: fixed; left: 0; right: 0; top: 0; z-index: 100; display: none; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; background: var(--no-soft); border-bottom: 3px solid var(--no); font-weight: 700; }
#errBar span { flex: 1 1 200px; }
.noscript { max-width: 520px; margin: 40px auto; padding: 20px; border: 3px solid var(--no); border-radius: 16px; background: var(--surface); }
#camBox { position: fixed; left: 12px; bottom: 12px; width: 168px; z-index: 40; border: 3px solid var(--line); border-radius: 12px; overflow: hidden; background: #000; display: none; }
#camBox video { display: block; width: 100%; height: auto; transform: scaleX(-1); }
#camBox .st { position: absolute; left: 6px; top: 6px; padding: 2px 8px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--no-soft); color: var(--ink); }
#camBox .st.ok { background: var(--yes-soft); }
#camBox .dir { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; padding: 3px; font-size: .85rem; font-weight: 700; background: rgba(0,0,0,.6); color: #fff; }
#lost { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 45; background: var(--warn-soft); color: var(--ink); border: 3px solid var(--warn); border-radius: 16px; padding: 14px 20px; font-weight: 700; font-size: 1.2rem; display: none; text-align: center; max-width: 90vw; }
#calib { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: none; }
#calib .msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; max-width: 560px; padding: 0 16px; }
#calib .msg h2 { margin: 0 0 6px; font-size: 2rem; }
#calib .msg p { margin: 0; color: var(--muted); }
#calib .msg .big { font-size: 6rem; line-height: 1; margin-bottom: 8px; }
</style>
</head>
<body>
<noscript><div class="noscript"><h1>JavaScript is off</h1><p>EyeLink needs JavaScript. Turn it on in your browser settings and reload this page.</p></div></noscript>
<div class="wrap">
  <header class="bar" id="bar" hidden>
    <div class="brand"><span class="eye"><i></i></span>EyeLink</div>
    <div class="tools">
      <div class="seg" role="group" aria-label="View">
        <button id="asPatient" aria-pressed="true">Patient view</button>
        <button id="asCaretaker" aria-pressed="false">Caretaker view</button>
      </div>
      <button class="plain" id="recal" hidden>Recalibrate</button>
      <button class="plain" id="logout">Log out</button>
    </div>
  </header>
  <main id="root"></main>
</div>

<div id="camBox"><video id="cam" playsinline muted></video><span class="st" id="camSt">No face</span><div class="dir" id="camDir">Head: –</div></div>
<div id="lost">Can’t see your face. Please move into the camera view.</div>
<div id="calib"><div class="msg" id="calMsg"></div></div>
<div id="errBar" role="alert"><span></span><button class="plain" id="errReload">Reload</button><button class="plain" id="errClose">Dismiss</button></div>
<div id="live" class="sr" aria-live="polite"></div>

<script type="module">
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const BUNDLES = [
  { js: "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs", wasm: "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm" },
  { js: "https://unpkg.com/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs", wasm: "https://unpkg.com/@mediapipe/tasks-vision@0.10.14/wasm" }
];
let FaceLandmarker = null, FilesetResolver = null, WASM_URL = "";
// Loaded on demand with a backup host, so the page itself always shows even if a CDN is down.
async function loadMediaPipe() {
  if (FaceLandmarker) return;
  for (const b of BUNDLES) {
    try { const m = await import(b.js); FaceLandmarker = m.FaceLandmarker; FilesetResolver = m.FilesetResolver; WASM_URL = b.wasm; return; }
    catch (e) { /* try the next host */ }
  }
  throw new Error("LOAD_FAIL");
}

const ITEMS = {
  Toilet: { icon: "🚻", urgency: "normal" }, Food: { icon: "🍽️", urgency: "normal" }, Water: { icon: "💧", urgency: "normal" },
  More: { icon: "➕" },
  Outside: { icon: "🌳", urgency: "normal" }, Sad: { icon: "😢", urgency: "high" },
  Entertainment: { icon: "🎬", urgency: "normal" }, "Change position": { icon: "🛏️", urgency: "normal" },
  Back: { icon: "⬅️" }, YES: { icon: "✔️" }, NO: { icon: "✖️" }
};
const HOME = ["Toilet", "Food", "Water", "More"];
const MORE = ["Outside", "Sad", "Entertainment", "Change position", "Back"];
const PATIENT_VIEWS = ["setup", "home", "more", "confirm", "sent"];
const STEPS = [
  ["Face the screen", "C", "⏺️"],
  ["Turn your head to the LEFT", "L", "⬅️"],
  ["Turn your head to the RIGHT", "R", "➡️"]
];
// share of your full left/right eye movement needed to trigger a move (smaller = easier)
const SENS = { Normal: 0.5, Easy: 0.35, Easiest: 0.25 };
const DIRNAME = { L: "Left", R: "Right", C: "Centre" };
const HOLD_MOVE = 40;    // ms a direction must be held before the highlight moves (near-instant)
const REPEAT_MS = 550;   // keep the head turned and the highlight keeps moving at this pace

const state = { user: null, view: "login", pending: null, dwell: 5, sens: "Easy", voice: true, showCam: true, loginRole: "patient", spoken: {}, dismissed: {}, focus: 0, keyMode: false };
const track = { started: false, loading: false, error: "", landmarker: null, video: null, lastVT: -1, calibrated: false, cal: null, calibrating: false };
let latest = null, sm = null, faceSeenAt = 0;
let zone = "C", zoneSince = 0, moved = false, lastMoveAt = 0, dwellStart = null, lockUntil = 0;
let msgs = [], bc = null;

try {
  const sv = JSON.parse(localStorage.getItem("eyelink_settings") || "null");
  if (sv) {
    if ([2, 3, 5].includes(sv.dwell)) state.dwell = sv.dwell;
    if (SENS[sv.sens]) state.sens = sv.sens;
    if (typeof sv.voice === "boolean") state.voice = sv.voice;
    if (typeof sv.showCam === "boolean") state.showCam = sv.showCam;
  }
} catch (e) {}
function saveSettings() { try { localStorage.setItem("eyelink_settings", JSON.stringify({ dwell: state.dwell, sens: state.sens, voice: state.voice, showCam: state.showCam })); } catch (e) {} }
try {
  const sc = JSON.parse(localStorage.getItem("eyelink_cal") || "null");
  if (sc && sc.cal && Date.now() - sc.t < 12 * 3600 * 1000) { track.cal = sc.cal; track.calibrated = true; }
} catch (e) {}
function saveCal() { try { localStorage.setItem("eyelink_cal", JSON.stringify({ cal: track.cal, t: Date.now() })); } catch (e) {} }

const $ = id => document.getElementById(id);
const root = $("root"), bar = $("bar");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const frame = () => new Promise(r => requestAnimationFrame(r));
const median = a => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };

/* ---------- storage / sync ---------- */
function load() { try { msgs = JSON.parse(localStorage.getItem("eyelink_msgs") || "[]"); } catch (e) {} }
function save() {
  try { localStorage.setItem("eyelink_msgs", JSON.stringify(msgs)); } catch (e) {}
  try { if (bc) bc.postMessage("sync"); } catch (e) {}
}
function onSync() {
  const before = msgs.length; load();
  if (msgs.length > before && state.view === "caretaker") beep();
  if (state.view === "caretaker") render();
  if (state.view === "home" || state.view === "more") updateBanner();
}
try { bc = new BroadcastChannel("eyelink"); bc.onmessage = onSync; } catch (e) {}
addEventListener("storage", e => { if (e.key === "eyelink_msgs") onSync(); });
load();

function speak(t) { if (!state.voice) return; try { if ("speechSynthesis" in window) { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(t)); } } catch (e) {} }
function beep() { try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .15; o.start(); o.stop(c.currentTime + .25); } catch (e) {} }
const fmtTime = t => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

/* ---------- tracking ---------- */
async function getCamera() {
  const tries = [
    { video: { width: 640, height: 480, frameRate: { ideal: 60 }, facingMode: "user" }, audio: false },
    { video: { facingMode: "user" }, audio: false },
    { video: true, audio: false }
  ];
  let err;
  for (const c of tries) {
    try { return await navigator.mediaDevices.getUserMedia(c); }
    catch (e) { err = e; if (e && (e.name === "NotAllowedError" || e.name === "SecurityError")) break; }
  }
  throw err;
}
function stopCamera() {
  try { if (track.stream) track.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  try { $("cam").srcObject = null; } catch (e) {}
  track.stream = null; track.video = null; track.started = false; track.lastVT = -1;
  try { if (wl) wl.release(); } catch (e) {}
  wl = null;
}
function onCameraLost() {
  if (!track.started) return;
  stopCamera();
  track.error = "The camera was disconnected. Reconnect it and try again.";
  if (PATIENT_VIEWS.includes(state.view)) { state.view = "setup"; render(); speak("Camera lost."); }
}
let wl = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator) { wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => { wl = null; }); } } catch (e) {}
}
let loopOn = false;
async function startTracking() {
  if (track.started || track.loading) return track.started;
  track.loading = true; track.error = "";
  try {
    if (!window.isSecureContext) { const e = new Error("Open this page from its https:// address (or http://localhost). Browsers block the camera on other addresses."); e.name = "Insecure"; throw e; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("This browser can’t use the camera. Try the latest Chrome or Edge.");
    if (typeof WebAssembly !== "object") throw new Error("This browser is too old for head tracking. Try the latest Chrome or Edge.");
    const stream = await getCamera();
    const v = $("cam"); v.srcObject = stream; await v.play();
    track.video = v; track.stream = stream;
    stream.getVideoTracks().forEach(t => t.addEventListener("ended", onCameraLost));
    if (!track.landmarker) {
      try {
        await loadMediaPipe();
        const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
        const opts = d => ({ baseOptions: { modelAssetPath: MODEL_URL, delegate: d }, runningMode: "VIDEO", numFaces: 1, outputFacialTransformationMatrixes: true });
        try { track.landmarker = await FaceLandmarker.createFromOptions(fileset, opts("GPU")); }
        catch (e) { track.landmarker = await FaceLandmarker.createFromOptions(fileset, opts("CPU")); }
      } catch (e) {
        const er = new Error("Could not download the tracking files. Check your internet connection and try again. After one successful load, the app also works offline.");
        er.name = "LoadFail"; throw er;
      }
    }
    track.started = true; state.keyMode = false;
    if (!loopOn) { loopOn = true; requestAnimationFrame(loop); }
    keepAwake();
  } catch (e) {
    stopCamera();
    const n = e && e.name;
    track.error = n === "NotAllowedError" || n === "SecurityError" ? "Camera permission was blocked. Tap the lock icon in the address bar, set Camera to Allow, then reload."
      : n === "NotFoundError" ? "No camera was found on this device."
      : n === "NotReadableError" ? "The camera is being used by another app. Close it and try again."
      : (e && e.message ? e.message : "Could not start head tracking.");
  }
  track.loading = false;
  return track.started;
}

function processResult(res, now) {
  // head turn (yaw) from the face transformation matrix
  const m = res.facialTransformationMatrixes && res.facialTransformationMatrixes[0];
  if (!m) { latest = { ok: false, t: now }; return; }
  const d = m.data;
  const yaw = Math.atan2(d[8], d[10]);
  latest = { ok: true, t: now, blink: false, gx: yaw, gy: 0 };
  faceSeenAt = now;
  sm = sm ? { x: sm.x + .7 * (yaw - sm.x), y: 0 } : { x: yaw, y: 0 };
}

function loop() {
  requestAnimationFrame(loop);
  const v = track.video;
  if (!track.landmarker || !v || v.readyState < 2) return;
  const now = performance.now();
  if (v.currentTime !== track.lastVT) {
    track.lastVT = v.currentTime;
    try { processResult(track.landmarker.detectForVideo(v, now), now); } catch (e) {}
  }
  step(now);
  paint(now);
}

/* ---------- calibration: 5 simple steps ---------- */
async function calibrate() {
  const ov = $("calib"), msg = $("calMsg");
  track.calibrating = true; track.calibrated = false; sm = null; zone = "C";
  ov.style.display = "block";
  const pts = {};
  for (let i = 0; i < STEPS.length; i++) {
    const [txt, key, icon] = STEPS[i];
    msg.innerHTML = `<div class="big">${icon}</div><h2>${txt}</h2><p>Step ${i + 1} of ${STEPS.length}. Turn gently. A small turn is enough, then hold it.</p>`;
    speak(txt);
    let got = [];
    for (let attempt = 0; attempt < 4 && got.length < 8; attempt++) {
      await sleep(1600);
      got = []; const t0 = performance.now(); let lastT = 0;
      while (performance.now() - t0 < 1300) {
        await frame();
        if (latest && latest.ok && !latest.blink && latest.t !== lastT) { lastT = latest.t; got.push([latest.gx, latest.gy]); }
      }
    }
    if (got.length < 8) return endCal(msg, ov, "Can’t see your face", "Move into the camera view, improve the light on your face, and try again.");
    pts[key] = { x: median(got.map(a => a[0])), y: median(got.map(a => a[1])) };
  }
  const c = pts.C;
  const flipX = (pts.R.x - pts.L.x) >= 0 ? 1 : -1;
  const ext = { R: flipX * (pts.R.x - c.x), L: flipX * (c.x - pts.L.x) };
  const small = Object.values(ext).some(v => v < 0.05);
  if (small) return endCal(msg, ov, "Head movement was too small", "Turn your head a little further to each side, then try again.");
  track.cal = { c, flipX, ext };
  track.calibrated = true; saveCal();
  msg.innerHTML = `<div class="big">✅</div><h2>Setup done</h2><p>Turn your head left or right to move. Keep it straight to select.</p>`;
  await sleep(2200);
  ov.style.display = "none"; track.calibrating = false;
  return true;
}
async function endCal(msg, ov, h, p) {
  msg.innerHTML = `<div class="big">⚠️</div><h2>${h}</h2><p>${p}</p>`;
  await sleep(3500);
  ov.style.display = "none"; track.calibrating = false; return false;
}

/* ---------- direction + dwell ---------- */
function fractions() {
  const cal = track.cal; if (!cal || !sm) return null;
  const dx = cal.flipX * (sm.x - cal.c.x);
  const fx = dx >= 0 ? dx / cal.ext.R : dx / cal.ext.L;
  return { fx: Math.max(-1.5, Math.min(1.5, fx)) };
}
function getTiles() { return [...root.querySelectorAll(".tile")]; }
function setRing(t, p, secs) {
  if (!t) return;
  t.querySelector(".ring").style.setProperty("--p", p);
  t.querySelector(".count").textContent = secs == null ? "" : secs.toFixed(1) + "s";
}
function setFocus(i, announce = true) {
  const tiles = getTiles(); if (!tiles.length) return;
  tiles.forEach(t => { t.classList.remove("focus"); setRing(t, 0); });
  state.focus = Math.max(0, Math.min(tiles.length - 1, i));
  tiles[state.focus].classList.add("focus");
  dwellStart = null;
  const l = tiles[state.focus].dataset.label, say = l === "YES" ? "Yes, send" : l === "NO" ? "No, cancel" : l;
  $("live").textContent = say;
  if (announce) speak(say);
}
function move(dir) {
  const n = getTiles().length; if (!n) return;
  if (state.view === "confirm") {            // direct: turn left = Yes (left tile), turn right = No (right tile)
    const wasChosen = state.chosen; state.chosen = true;
    const target = dir === "L" ? 0 : 1;
    if (target !== state.focus || !wasChosen) setFocus(target);
    return;
  }
  const i = state.focus;
  setFocus(dir === "R" ? (i + 1) % n : (i - 1 + n) % n);
}
function selectFocused() { const t = getTiles()[state.focus]; if (t && t._done) t._done(); }

function step(now) {
  const active = ["home", "more", "confirm"].includes(state.view);
  const ok = track.calibrated && !track.calibrating && now - faceSeenAt < 1200 && sm;
  if (!active || !ok || now < lockUntil) { dwellStart = null; const f = getTiles()[state.focus]; if (f) setRing(f, 0); return; }
  const fr = fractions(); if (!fr) return;
  const k = SENS[state.sens], m = Math.abs(fr.fx);
  let z = zone;
  if (zone === "C") { if (m >= k) z = fr.fx > 0 ? "R" : "L"; }
  else if (m < k * 0.65) z = "C";
  if (z !== zone) { zone = z; zoneSince = now; if (z === "C") { moved = false; dwellStart = null; } }
  if (zone !== "C") {
    dwellStart = null;
    if (!moved && now - zoneSince >= HOLD_MOVE) { moved = true; lastMoveAt = now; move(zone); }
    else if (moved && state.view !== "confirm" && now - lastMoveAt >= REPEAT_MS) { lastMoveAt = now; move(zone); }
    return;
  }
  // zone is centre: hold still to select the highlighted option
  if (state.view === "confirm" && !state.chosen) { dwellStart = null; return; }
  if (dwellStart == null) dwellStart = now;
  const ms = state.dwell * 1000, p = Math.min((now - dwellStart) / ms, 1), f = getTiles()[state.focus];
  setRing(f, p, Math.max(ms - (now - dwellStart), 0) / 1000);
  if (p >= 1) { dwellStart = null; selectFocused(); }
}

function paint(now) {
  const patient = PATIENT_VIEWS.includes(state.view);
  const show = patient && state.showCam && track.started && !track.calibrating;
  $("camBox").style.display = show ? "block" : "none";
  const ok = now - faceSeenAt < 1200;
  const st = $("camSt"); st.textContent = ok ? "Face found" : "No face"; st.className = "st" + (ok ? " ok" : "");
  $("camDir").textContent = "Head: " + (ok && track.calibrated ? DIRNAME[zone] : "–");
  $("lost").style.display = (["home", "more", "confirm"].includes(state.view) && track.started && track.calibrated && !track.calibrating && !ok) ? "block" : "none";
}

/* keyboard fallback for testing */
addEventListener("keydown", e => {
  if (!["home", "more", "confirm"].includes(state.view)) return;
  const map = { ArrowLeft: "L", ArrowRight: "R" };
  if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
  else if (e.key === "Enter" && e.target.tagName !== "SELECT" && e.target.tagName !== "BUTTON") { e.preventDefault(); selectFocused(); }
  else if (e.key === " " && !["SELECT", "BUTTON", "INPUT"].includes(e.target.tagName)) { e.preventDefault(); move("R"); }
});

/* ---------- actions ---------- */
function pick(label) {
  if (label === "More") state.view = "more";
  else if (label === "Back") state.view = "home";
  else { state.pending = label; state.view = "confirm"; speak(label + ". Are you sure?"); }
  render();
}
function answer(label) {
  if (label === "YES") {
    const it = ITEMS[state.pending];
    msgs.unshift({ id: Date.now(), text: state.pending, icon: it.icon, urgency: it.urgency, time: Date.now(), reply: null });
    if (msgs.length > 100) msgs.length = 100; save(); state.view = "sent"; speak("Sent. Your caretaker has been notified."); render();
    setTimeout(() => { if (state.view === "sent") { state.view = "home"; state.pending = null; render(); } }, 3500);
  } else { state.view = "home"; state.pending = null; speak("Cancelled."); render(); }
}
function reply(id, text) { const m = msgs.find(x => x.id === id); if (m) { m.reply = text; save(); render(); } }
const latestReply = () => msgs.find(m => m.reply && !state.dismissed[m.id]);
function updateBanner() {
  const b = $("banner"); if (!b) return;
  const m = latestReply();
  if (!m) { b.hidden = true; return; }
  b.hidden = false; b.textContent = "Caretaker: " + m.reply + " (about " + m.text + ")";
  if (!state.spoken[m.id]) { state.spoken[m.id] = true; speak("Caretaker says: " + m.reply); setTimeout(() => { state.dismissed[m.id] = true; updateBanner(); }, 12000); }
}

/* ---------- views ---------- */
function tileHTML(label, cls = "") {
  const it = ITEMS[label];
  return `<div class="tile ${cls}" data-label="${label}"><span class="count" aria-hidden="true"></span>
    <span class="ring"><span class="disc">${it.icon}</span></span>
    <span class="label">${label === "YES" ? "◀ Yes, send" : label === "NO" ? "No, cancel ▶" : label}</span></div>`;
}
function bindTiles(handler, start) {
  root.querySelectorAll(".tile").forEach(t => { t._done = () => handler(t.dataset.label); });
  setFocus(start, false);
}

function render() {
  lockUntil = performance.now() + 900;
  dwellStart = null; zone = "C"; moved = false;
  bar.hidden = state.view === "login";
  $("asPatient").setAttribute("aria-pressed", String(state.view !== "caretaker"));
  $("asCaretaker").setAttribute("aria-pressed", String(state.view === "caretaker"));
  $("recal").hidden = !(track.started && PATIENT_VIEWS.includes(state.view) && state.view !== "setup");

  if (state.view === "login") return renderLogin();
  if (state.view === "caretaker") return renderCaretaker();
  if (state.view === "setup") return renderSetup();
  if (state.view === "sent") {
    root.innerHTML = `<div class="sent"><div class="tick">✔</div><h1 class="title">Message sent</h1><p class="sub">Your caretaker has been notified.</p></div>`;
    return;
  }
  if (state.view === "confirm") {
    const it = ITEMS[state.pending];
    root.innerHTML = `<div class="confirmTop"><span class="big">${it.icon}</span><h1 class="title">Send “${state.pending}”?</h1></div>
      <div class="grid two fill">${tileHTML("YES", "yes")}${tileHTML("NO", "no")}</div>
      <p class="how">Turn your head <b>left for Yes</b> or <b>right for No</b>, then keep it straight for ${state.dwell} seconds to confirm.</p>`;
    state.chosen = false; bindTiles(answer, 1); return;   // starts on "No" for safety; the timer only starts after a deliberate turn
  }
  const labels = state.view === "more" ? MORE : HOME;
  root.innerHTML = `
    <div class="settings">
      <label>Look time <select id="dwellSel">${[2, 3, 5].map(s => `<option value="${s}" ${s === state.dwell ? "selected" : ""}>${s} seconds</option>`).join("")}</select></label>
      <label>Movement needed <select id="sensSel">${Object.keys(SENS).map(s => `<option ${s === state.sens ? "selected" : ""}>${s}</option>`).join("")}</select></label>
      <label class="chk"><input type="checkbox" id="voiceChk" ${state.voice ? "checked" : ""}> Speak aloud</label>
      <label class="chk"><input type="checkbox" id="camChk" ${state.showCam ? "checked" : ""}> Show camera</label>
    </div>
    <div class="banner" id="banner" hidden></div>
    <h1 class="title">${state.view === "more" ? "More options" : "What do you need?"}</h1>
    <div class="grid quad fill">${labels.map(l => tileHTML(l, l === "Back" ? "wide" : "")).join("")}</div>
    <p class="how">Turn your head left or right to move the highlight. Keep your head straight on the highlighted option for ${state.dwell} seconds to select it. Keyboard or switch: Space moves, Enter selects.</p>`;
  bindTiles(pick, 0);
  $("dwellSel").onchange = e => { state.dwell = Number(e.target.value); saveSettings(); e.target.blur(); };
  $("sensSel").onchange = e => { state.sens = e.target.value; saveSettings(); e.target.blur(); };
  $("voiceChk").onchange = e => { state.voice = e.target.checked; saveSettings(); };
  $("camChk").onchange = e => { state.showCam = e.target.checked; saveSettings(); };
  updateBanner();
}

function renderSetup() {
  const busy = track.loading, saved = !!(track.cal && track.calibrated);
  const insecure = !window.isSecureContext;
  root.innerHTML = `<div class="panel">
    <h1 class="title" style="margin-top:0">Set up head control</h1>
    <p class="sub">A caretaker should do this first step with the mouse. After setup, the patient only needs to move their head.</p>
    <ol>
      <li>Place the screen at arm’s length, with the camera at eye level, and sit comfortably facing it.</li>
      <li>Light the face from the front. Avoid a bright window behind.</li>
      <li>Allow the camera when the browser asks.</li>
      <li>The patient follows 3 short steps: face the screen, then turn the head left, then right.</li>
    </ol>
    ${insecure ? `<div class="status err">This page is not on a secure address, so the camera is blocked. Open it from its https:// link.</div>` : ""}
    ${track.error ? `<div class="status err">${track.error}</div>` : ""}
    ${busy ? `<div class="status">Starting camera and loading head tracking…</div>` : ""}
    <button class="go" id="startBtn" ${busy ? "disabled" : ""}>${saved ? "Start camera (use saved setup)" : track.error ? "Try again" : "Start camera and set up"}</button>
    ${saved ? `<button class="plain" id="redoBtn" style="width:100%;margin-top:10px" ${busy ? "disabled" : ""}>Start camera and set up again</button>` : ""}
    <button class="plain" id="kbBtn" style="width:100%;margin-top:10px">No camera? Use a keyboard or switch instead</button>
  </div>`;
  $("startBtn").onclick = () => beginSetup(false);
  if ($("redoBtn")) $("redoBtn").onclick = () => beginSetup(true);
  $("kbBtn").onclick = () => { state.keyMode = true; state.view = "home"; render(); };
}
async function beginSetup(force) {
  renderSetup();
  const ok = track.started || await startTracking();
  if (!ok) { renderSetup(); return; }
  renderSetup();
  if (!force && track.cal && track.calibrated) { state.view = "home"; speak("Head control is ready."); render(); return; }
  const done = await calibrate();
  if (done) { state.view = "home"; speak("Head control is ready."); }
  render();
}

function renderLogin() {
  const r = state.loginRole;
  root.innerHTML = `<div class="login">
    <div class="brand" style="margin-bottom:14px"><span class="eye"><i></i></span>EyeLink</div>
    <h1>Log in</h1><p class="sub">Prototype. Any details will work.</p>
    <div class="roles" role="group" aria-label="Log in as">
      <button id="rP" aria-pressed="${r === "patient"}"><span class="e">🙂</span>Patient</button>
      <button id="rC" aria-pressed="${r === "caretaker"}"><span class="e">🧑‍⚕️</span>Caretaker</button>
    </div>
    <div class="field"><label for="em">Email</label><input id="em" type="email" value="${r}@example.com" autocomplete="off"></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" value="password" autocomplete="off"></div>
    <button class="go" id="go">Log in as ${r}</button></div>`;
  $("rP").onclick = () => { state.loginRole = "patient"; renderLogin(); };
  $("rC").onclick = () => { state.loginRole = "caretaker"; renderLogin(); };
  $("go").onclick = () => {
    state.user = { email: $("em").value, role: state.loginRole };
    state.view = state.loginRole === "caretaker" ? "caretaker" : patientStart();
    render();
  };
}

function renderCaretaker() {
  const open = msgs.filter(m => !m.reply).length;
  root.innerHTML = `<div class="topline"><h1 class="title">Requests${open ? " (" + open + " waiting)" : ""}</h1>${msgs.length ? `<button class="plain" id="clear">Clear all</button>` : ""}</div>
    <div class="list">${msgs.length ? msgs.map(m => `
      <div class="card ${m.reply ? "" : "open"}">
        <div class="head"><span class="ic">${m.icon}</span><div><div class="tx">${m.text}</div><div class="tm">${fmtTime(m.time)}</div></div>
          ${m.urgency === "high" && !m.reply ? `<span class="badge">Check soon</span>` : ""}</div>
        ${m.reply ? `<div class="replied">You replied: ${m.reply}</div>` : `<div class="actions">
          <button data-id="${m.id}" data-r="Coming now">Coming now</button>
          <button data-id="${m.id}" data-r="Wait 5 minutes">Wait 5 minutes</button>
          <button data-id="${m.id}" data-r="Done">Done</button></div>`}
      </div>`).join("") : `<div class="empty">No requests yet. Patient requests will appear here.</div>`}</div>`;
  root.querySelectorAll(".actions button").forEach(b => b.onclick = () => reply(Number(b.dataset.id), b.dataset.r));
  const c = $("clear"); if (c) c.onclick = () => { msgs = []; save(); render(); };
}

/* ---------- header ---------- */
const patientStart = () => ((track.started && track.calibrated) || state.keyMode) ? "home" : "setup";
$("asPatient").onclick = () => { if (state.view === "caretaker") { state.view = patientStart(); load(); render(); } };
$("asCaretaker").onclick = () => { state.view = "caretaker"; load(); render(); };
$("recal").onclick = async () => { const ok = await calibrate(); state.view = ok ? "home" : "setup"; render(); };
$("logout").onclick = () => { stopCamera(); state.user = null; state.keyMode = false; state.view = "login"; state.pending = null; render(); };

/* ---------- robustness helpers ---------- */
function showErr(m) { const b = $("errBar"); b.querySelector("span").textContent = m; b.style.display = "flex"; }
$("errReload").onclick = () => location.reload();
$("errClose").onclick = () => { $("errBar").style.display = "none"; };
addEventListener("error", e => { if (e.message && /ResizeObserver/.test(e.message)) return; showErr("Something went wrong. If the screen stops responding, reload the page."); });
addEventListener("unhandledrejection", () => showErr("Something went wrong. If the screen stops responding, reload the page."));
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { zone = "C"; dwellStart = null; sm = null; if (track.started && !wl) keepAwake(); }
});
function registerSW() { if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("./sw.js").catch(() => {}); }
if (document.readyState === "complete") registerSW(); else addEventListener("load", registerSW);

render();
</script>
</body>
</html>
